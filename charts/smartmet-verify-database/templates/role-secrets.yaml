{{/*
One kubernetes.io/basic-auth Secret per managed role that does not supply its
own via `existingSecret`.

Precedence per role, with no silent fallback:
  1. existingSecret -> no Secret rendered here at all
  2. password       -> rendered with that literal
  3. auth.generatePasswords -> reuse the in-cluster password, else generate
  4. otherwise      -> fail the render with an actionable message

CNPG requires type kubernetes.io/basic-auth (it rejects Opaque) and requires the
`username` key to match the PostgreSQL role name byte for byte. Note that the
object NAME is sanitised for RFC 1123 (underscores are illegal) while `username`
keeps the original role name -- see roleSecretName in _helpers.tpl.
*/}}
{{- $root := . -}}
{{- range $role := .Values.roles }}
{{- if $role.enabled }}
{{- if not $role.existingSecret }}
{{- if and (not $role.password) (not $root.Values.auth.generatePasswords) }}
{{- fail (printf "role %q: auth.generatePasswords is false, so you must set either roles[].existingSecret or roles[].password for it" $role.name) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smartmet-verify-database.roleSecretName" (list $root $role) }}
  labels:
    {{- include "smartmet-verify-database.componentLabels" (list $root "database") | nindent 4 }}
  {{- with $root.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $role.name | quote }}
  password: {{ include "smartmet-verify-database.rolePassword" (list $root $role) | quote }}
{{- end }}
{{- end }}
{{- end }}
