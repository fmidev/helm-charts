{{- $dbMode := default "sidecar" .Values.opmet.db.mode }}
{{- $external := .Values.opmet.db.external }}
{{- $secretProvider := $external.secretProvider }}
{{- $source := default "inline" $external.source }}
{{- if and (eq $dbMode "external") (not (has $source (list "inline" "secretProvider" "existingSecret"))) }}
{{- fail "opmet.db.external.source must be one of: inline, secretProvider, existingSecret" }}
{{- end }}
{{- if and (eq $dbMode "external") (not $external.secretName) }}
{{- fail "opmet.db.external.secretName is required when opmet.db.mode is external" }}
{{- end }}
{{- if and (eq $dbMode "external") (not $external.secretKey) }}
{{- fail "opmet.db.external.secretKey is required when opmet.db.mode is external" }}
{{- end }}
{{- if and (eq $dbMode "external") (eq $source "secretProvider") }}
{{- if not (has $secretProvider.provider (list "aws" "azure" "gcp" "vault")) }}
{{- fail "opmet.db.external.secretProvider.provider must be one of: aws, azure, gcp, vault" }}
{{- end }}
{{- if not $secretProvider.className }}
{{- fail "opmet.db.external.secretProvider.className is required when source is secretProvider" }}
{{- end }}
{{- if not $secretProvider.objectName }}
{{- fail "opmet.db.external.secretProvider.objectName is required when source is secretProvider" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $secretProvider.className }}
spec:
  provider: {{ $secretProvider.provider }}
  parameters:
  {{- if or (eq $secretProvider.provider "aws") (eq $secretProvider.provider "azure") }}
    objects: |
      - objectName: {{ $secretProvider.objectName | quote }}
        objectType: {{ $secretProvider.objectType | quote }}
  {{- else if eq $secretProvider.provider "gcp" }}
    secrets: |
      - resourceName: {{ $secretProvider.objectName | quote }}
        path: {{ $secretProvider.path | quote }}
  {{- else if eq $secretProvider.provider "vault" }}
    objects: |
      - objectName: {{ $secretProvider.objectName | quote }}
        secretPath: {{ $secretProvider.path | quote }}
        secretKey: {{ $secretProvider.key | quote }}
  {{- end }}
  {{- range $key, $value := $secretProvider.parameters }}
    {{ $key }}: {{ $value }}
  {{- end }}
  secretObjects:
  - data:
    - key: {{ $external.secretKey }}
      objectName: {{ $secretProvider.objectName }}
    secretName: {{ $external.secretName }}
    type: Opaque
{{- else if and (eq $dbMode "external") (eq $source "inline") }}
{{- if not $external.encodedConnectionString }}
{{- fail "opmet.db.external.encodedConnectionString is required when source is inline" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $external.secretName }}
data:
  {{ $external.secretKey }}: {{ $external.encodedConnectionString }}
{{- end }}
