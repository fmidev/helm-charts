{{- $publisherSecrets := .Values.opmet.publisher.secrets }}
{{- $provider := $publisherSecrets.provider }}
{{- $hasPublisherSecrets := or (gt (len $publisherSecrets.sshKeys) 0) (gt (len $publisherSecrets.sshPassphrases) 0) }}
{{- if or (hasKey .Values "secretProvider") (hasKey .Values "secretProviderParameters") (hasKey .Values.opmet "spcName") (hasKey .Values.opmet "ssh_secrets") (hasKey .Values.opmet "ssh_passphrase_secrets") (hasKey .Values.opmet "ssh_secret") (hasKey .Values.opmet "ssh_secret_passphrase") (hasKey .Values.opmet "ssh_secret_passphrases") }}
{{- fail "Legacy publisher secret values were removed in chart 4.0.0. Use opmet.publisher.secrets instead." }}
{{- end }}
{{- if and $hasPublisherSecrets $provider (not (has $provider (list "aws" "azure" "gcp" "vault"))) }}
{{- fail "opmet.publisher.secrets.provider must be empty or one of: aws, azure, gcp, vault" }}
{{- end }}
{{- if and $hasPublisherSecrets $provider (not $publisherSecrets.className) }}
{{- fail "opmet.publisher.secrets.className is required when a provider is configured" }}
{{- end }}
{{- $secretNames := dict }}
{{- range $secret := $publisherSecrets.sshKeys }}
{{- if not $secret.secretName }}{{ fail "every opmet.publisher.secrets.sshKeys entry requires secretName" }}{{ end }}
{{- if or (gt (len $secret.secretName) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $secret.secretName)) }}{{ fail "every opmet.publisher.secrets.sshKeys secretName must be a valid Kubernetes Secret name" }}{{ end }}
{{- range $label := splitList "." $secret.secretName }}{{ if gt (len $label) 63 }}{{ fail "every DNS label in an opmet.publisher.secrets.sshKeys secretName must be at most 63 characters" }}{{ end }}{{ end }}
{{- if hasKey $secretNames $secret.secretName }}{{ fail (printf "publisher Secret name %q must be unique" $secret.secretName) }}{{ end }}
{{- $_ := set $secretNames $secret.secretName true }}
{{- if and $provider (not $secret.objectName) }}{{ fail "every provider-backed opmet.publisher.secrets.sshKeys entry requires objectName" }}{{ end }}
{{- if and (eq $provider "gcp") (not $secret.path) }}{{ fail "every GCP-backed opmet.publisher.secrets.sshKeys entry requires path" }}{{ end }}
{{- if and (eq $provider "vault") (not $secret.path) }}{{ fail "every Vault-backed opmet.publisher.secrets.sshKeys entry requires path" }}{{ end }}
{{- if and (eq $provider "vault") (not $secret.key) }}{{ fail "every Vault-backed opmet.publisher.secrets.sshKeys entry requires key" }}{{ end }}
{{- if and (not $provider) (not $secret.encodedValue) }}{{ fail "every inline opmet.publisher.secrets.sshKeys entry requires encodedValue" }}{{ end }}
{{- end }}
{{- $envNames := dict }}
{{- range $secret := $publisherSecrets.sshPassphrases }}
{{- if not $secret.secretName }}{{ fail "every opmet.publisher.secrets.sshPassphrases entry requires secretName" }}{{ end }}
{{- if or (gt (len $secret.secretName) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $secret.secretName)) }}{{ fail "every opmet.publisher.secrets.sshPassphrases secretName must be a valid Kubernetes Secret name" }}{{ end }}
{{- range $label := splitList "." $secret.secretName }}{{ if gt (len $label) 63 }}{{ fail "every DNS label in an opmet.publisher.secrets.sshPassphrases secretName must be at most 63 characters" }}{{ end }}{{ end }}
{{- if hasKey $secretNames $secret.secretName }}{{ fail (printf "publisher Secret name %q must be unique" $secret.secretName) }}{{ end }}
{{- $_ := set $secretNames $secret.secretName true }}
{{- if not $secret.envName }}{{ fail "every opmet.publisher.secrets.sshPassphrases entry requires envName" }}{{ end }}
{{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $secret.envName) }}{{ fail "every opmet.publisher.secrets.sshPassphrases envName must be a valid environment variable name" }}{{ end }}
{{- if eq $secret.envName "SERVERS" }}{{ fail "SERVERS is reserved and cannot be used as an opmet.publisher.secrets.sshPassphrases envName" }}{{ end }}
{{- if hasKey $envNames $secret.envName }}{{ fail (printf "publisher passphrase environment variable %q must be unique" $secret.envName) }}{{ end }}
{{- $_ := set $envNames $secret.envName true }}
{{- if and $provider (not $secret.objectName) }}{{ fail "every provider-backed opmet.publisher.secrets.sshPassphrases entry requires objectName" }}{{ end }}
{{- if and (eq $provider "gcp") (not $secret.path) }}{{ fail "every GCP-backed opmet.publisher.secrets.sshPassphrases entry requires path" }}{{ end }}
{{- if and (eq $provider "vault") (not $secret.path) }}{{ fail "every Vault-backed opmet.publisher.secrets.sshPassphrases entry requires path" }}{{ end }}
{{- if and (eq $provider "vault") (not $secret.key) }}{{ fail "every Vault-backed opmet.publisher.secrets.sshPassphrases entry requires key" }}{{ end }}
{{- if and (not $provider) (not $secret.encodedValue) }}{{ fail "every inline opmet.publisher.secrets.sshPassphrases entry requires encodedValue" }}{{ end }}
{{- end }}
{{- if and $hasPublisherSecrets $provider }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $publisherSecrets.className }}
spec:
  provider: {{ $provider }}
  parameters:
  {{- if eq $provider "aws" }}
    objects: |
    {{- range $secret := concat $publisherSecrets.sshKeys $publisherSecrets.sshPassphrases }}
      - objectName: {{ $secret.objectName | quote }}
        objectType: {{ default "secretsmanager" $secret.objectType | quote }}
    {{- end }}
  {{- else if eq $provider "azure" }}
    objects: |
      array:
    {{- range $secret := concat $publisherSecrets.sshKeys $publisherSecrets.sshPassphrases }}
        - |
          objectName: {{ $secret.objectName | quote }}
          objectType: {{ default "secret" $secret.objectType | quote }}
    {{- end }}
  {{- else if eq $provider "vault" }}
    objects: |
    {{- range $secret := concat $publisherSecrets.sshKeys $publisherSecrets.sshPassphrases }}
      - objectName: {{ $secret.objectName | quote }}
        secretPath: {{ $secret.path | quote }}
        secretKey: {{ $secret.key | quote }}
    {{- end }}
  {{- else if eq $provider "gcp" }}
    secrets: |
    {{- range $secret := concat $publisherSecrets.sshKeys $publisherSecrets.sshPassphrases }}
      - resourceName: {{ $secret.objectName | quote }}
        path: {{ $secret.path | quote }}
    {{- end }}
  {{- end }}
  {{- range $key, $value := $publisherSecrets.parameters }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
  secretObjects:
  {{- range $secret := $publisherSecrets.sshKeys }}
  - data:
    - key: ssh-privatekey
    {{- if eq $provider "gcp" }}
      objectName: {{ $secret.path }}
    {{- else }}
      objectName: {{ $secret.objectName }}
    {{- end }}
    secretName: {{ $secret.secretName }}
    type: kubernetes.io/ssh-auth
  {{- end }}
  {{- range $secret := $publisherSecrets.sshPassphrases }}
  - data:
    - key: SSH_KEY_PASSPHRASE
    {{- if eq $provider "gcp" }}
      objectName: {{ $secret.path }}
    {{- else }}
      objectName: {{ $secret.objectName }}
    {{- end }}
    secretName: {{ $secret.secretName }}
    type: Opaque
  {{- end }}
{{- else if $hasPublisherSecrets }}
{{- range $secret := $publisherSecrets.sshKeys }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret.secretName }}
type: kubernetes.io/ssh-auth
data:
  ssh-privatekey: {{ $secret.encodedValue }}
{{- end }}
{{- range $secret := $publisherSecrets.sshPassphrases }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret.secretName }}
type: Opaque
data:
  SSH_KEY_PASSPHRASE: {{ $secret.encodedValue }}
{{- end }}
{{- end }}
