{{- $dbUsesAws := and (eq .Values.opmet.db.mode "external") (eq .Values.opmet.db.external.source "secretProvider") (eq .Values.opmet.db.external.secretProvider.provider "aws") }}
{{- $publisherSecrets := .Values.opmet.publisher.secrets }}
{{- $hasPublisherSecrets := or (gt (len $publisherSecrets.sshKeys) 0) (gt (len $publisherSecrets.sshPassphrases) 0) }}
{{- $publisherUsesAws := and $hasPublisherSecrets (eq $publisherSecrets.provider "aws") }}
{{- if or $dbUsesAws $publisherUsesAws }}
{{- if not .Values.opmet.secretServiceAccount }}
{{- fail "opmet.secretServiceAccount is required when an AWS secret provider is used" }}
{{- end }}
{{- if not .Values.opmet.iamRoleARN }}
{{- fail "opmet.iamRoleARN is required when an AWS secret provider is used" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.opmet.secretServiceAccount }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.opmet.iamRoleARN }}
{{- end }}
