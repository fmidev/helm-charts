versions:
  opmet:

opmet:
  name: opmet
  registry: registry.gitlab.com/opengeoweb/backend-services/opmet-backend/opmet-backend
  path: /opmet/(.*)
  svcPort: 80
  replicas: 1
  minPodsAvailable: 0
  secretServiceAccount: opmet-service-account
  iamRoleARN: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "15m"
    limits:
      memory: "512Mi"
  startupProbe:
    httpGet:
      path: /healthcheck?startup=true
      port: 8000
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 24  # Allow 4 minutes for startup
  livenessProbe:
    httpGet:
      path: /
      port: 8000
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 2
  readinessProbe:
    httpGet:
      path: /healthcheck?readiness=true
      port: 8000
    periodSeconds: 45
    timeoutSeconds: 20
    failureThreshold: 1
  env:
    MESSAGECONVERTER_URL: "http://localhost:8080"
    OPMET_BACKEND_PORT_HTTP: 8000
    PUBLISHER_URL: "http://localhost:8090/publish"
    APPLICATION_ROOT_PATH: "/opmet"
  messageconverter:
    name: opmet-messageconverter
    registry: registry.gitlab.com/opengeoweb/avi-msgconverter/geoweb-knmi-avi-messageservices
    version: "v2.1.0"
    port: 8080
    resources:
      requests:
        memory: "512Mi"
        cpu: "10m"
      limits:
        memory: "1024Mi"
    startupProbe:
      httpGet:
        path: /healthcheck?startup=true
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 24  # Allow 4 minutes for startup
    livenessProbe:
      httpGet:
        path: /healthcheck
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 2
    readinessProbe:
      httpGet:
        path: /healthcheck?readiness=true
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 2
  publisher:
    name: opmet-publisher
    registry: registry.gitlab.com/opengeoweb/backend-services/opmet-backend/opmet-backend-publisher-local
    version:
    port: 8090
    DESTINATION: /app/output
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
    secrets:
      # Leave provider empty to create Secrets from encodedValue. Set a
      # provider to fetch objectName values through the Secrets Store CSI
      # driver. Publisher secrets are independent from database credentials.
      provider: ""
      className: opmet-publisher-spc
      parameters: {}
      sshKeys: []
      sshPassphrases: []
    startupProbe:
      httpGet:
        path: /healthcheck?startup=true
        port: 8090
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 12  # Allow 2 minutes for startup
    livenessProbe:
      httpGet:
        path: /openapi.json
        port: 8090
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 2
    readinessProbe:
      httpGet:
        path: /healthcheck?readiness=true
        port: 8090
      periodSeconds: 45
      timeoutSeconds: 20
      failureThreshold: 1
  nginx:
    name: opmet-nginx
    registry: registry.gitlab.com/opengeoweb/backend-services/auth-backend/auth-backend
    version: "v0.7.2"
    ENV_VAR_STRICT_MODE: "FALSE"
    ENABLE_SSL: "FALSE"
    NGINX_PORT_HTTP: 80
    NGINX_PORT_HTTPS: 443
    BACKEND_HOST: 0.0.0.0:8000
    resources:
      requests:
        memory: "16Mi"
        cpu: "5m"
      limits:
        memory: "32Mi"
    startupProbe:
      httpGet:
        path: /health_check?startup=true
        port: 80
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12  # Allow a minute for startup
    livenessProbe:
      httpGet:
        path: /health_check
        port: 80
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    readinessProbe:
      httpGet:
        path: /health_check?readiness=true
        port: 80
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 1
  db:
    # Supported values: sidecar, external, zalando.
    mode: sidecar
    name: opmet-db
    databaseName: opmet
    username: geoweb
    sidecar:
      image: postgres
      port: 5432
      password: postgres
    external:
      # Supported values: inline, secretProvider, existingSecret.
      source: inline
      secretName: opmet-db
      secretKey: OPMET_BACKEND_DB
      encodedConnectionString: cG9zdGdyZXNxbDovL2dlb3dlYjpwb3N0Z3Jlc0Bsb2NhbGhvc3Q6NTQzMi9vcG1ldA==
      secretProvider:
        provider: ""
        className: opmet-db-spc
        objectName: ""
        objectType: secretsmanager
        path: ""
        key: ""
        parameters: {}
    zalando:
      teamId: geoweb
      postgresVersion: 15
      instances: 1
      volumeSize: 100Mi
      enableLogicalBackup: true
      clone:
        enabled: false
        timestamp: "2030-01-01T00:00:00+00:00"
        backupBucket: ""
  useCustomConfigurationFiles: false
  customConfigurationLocation: local
  customConfigurationMountPath: /app/configuration_files/custom
  volumeAccessMode: ReadOnlyMany
  volumeSize: 100Mi

ingress:
  name: nginx-ingress-controller
  ingressClassName: nginx
