# Automatically generated secret if auth is enabled and plaintext password is provided.
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fmi-redis.fullname" . }}
  labels:
    app: {{ include "fmi-redis.fullname" . }}
type: Opaque
stringData:
  redis-password: {{ required "auth.password is required when auth.enabled=true and auth.existingSecret is unset" .Values.auth.password | quote }}
{{- end }}
