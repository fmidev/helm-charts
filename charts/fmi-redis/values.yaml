image:
  repository: docker.io/library/redis
  tag: "8-alpine"
  pullPolicy: IfNotPresent

# The official redis image starts as root and only drops to a non-root user
# inside docker-entrypoint.sh (via gosu), so it has no static non-root USER
# for kubelet to discover — runAsNonRoot without an explicit runAsUser fails
# admission with "container has runAsNonRoot and image will run as root".
# These values must be set explicitly instead, and must match the actual
# uid/gid the chosen image.tag runs as:
#   redis:8-alpine -> uid=999(redis) gid=1000(redis)
#   redis:8         -> uid=999(redis) gid=999(redis)
# Override both if you change image.tag to a variant with different ids.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 1000
  fsGroup: 1000

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

# Single Redis instance — no replication/Sentinel. This chart intentionally
# does not support HA: if your app needs failover for redis, look elsewhere
# (e.g. a Sentinel/Operator-based chart).
persistence:
  enabled: true
  size: 8Gi
  storageClassName: ""

auth:
  enabled: false
  # Name of an existing Secret containing the password. Takes precedence over
  # `password` below. Must contain a `redis-password` key.
  existingSecret: ""
  # Only used when `existingSecret` is empty and auth is enabled.
  password: ""

service:
  port: 6379

config:
  enabled: false
  # Name of an existing ConfigMap containing a `redis.conf` key. Takes
  # precedence over `content` below.
  existingConfigMap: ""
  # Write raw redis.conf content, only used when `existingConfigMap` and `config.enabled`
  # Don't set `requirepass` in there — auth.enabled applies it separately as a
  # --requirepass argument on top of this file.
  content: ""
