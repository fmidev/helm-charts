image:
  repository: docker.io/library/redis
  tag: "8-alpine"
  pullPolicy: IfNotPresent

# imagePullSecrets:
#   - name: my-registry-secret
imagePullSecrets: []

# Use runAsNonRoot, with no fixed runAsUser/fsGroup: on OpenShift,
# SCC assigns a non-root uid/fsGroup from the namespace's own
# allocated range automatically when these are left unset
#
# On a plain Kubernetes cluster with no such admission controller, there's no automatic assignment.
# The official redis image also has no static non-root USER of its own.
# It drops privileges inside its entrypoint so runAsNonRoot without an explicit runAsUser fails.
# For that case, override this to match the image's actual uid/gid,
# used for exactly this in this chart's own CI:
#   redis:8-alpine -> runAsUser: 999, runAsGroup: 1000, fsGroup: 1000
#   redis:8         -> runAsUser: 999, runAsGroup: 999,  fsGroup: 999
podSecurityContext:
  runAsNonRoot: true

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

# Single Redis instance — no replication/Sentinel. This chart intentionally
# does not support HA: if your app needs failover for redis, look elsewhere
# (e.g. a Sentinel/Operator-based chart).
persistence:
  enabled: true
  size: 8Gi
  storageClassName: ""

auth:
  enabled: false
  # Name of an existing Secret containing the password. Takes precedence over
  # `password` below. Must contain a `redis-password` key.
  existingSecret: ""
  # Only used when `existingSecret` is empty and auth is enabled.
  password: ""

service:
  port: 6379

config:
  enabled: false
  # Name of an existing ConfigMap containing a `redis.conf` key. Takes
  # precedence over `content` below.
  existingConfigMap: ""
  # Write raw redis.conf content, only used when config.enabled=true and existingConfigMap is empty.
  # Don't set `requirepass` in there — auth.enabled applies it separately as a
  # --requirepass argument on top of this file.
  content: ""
