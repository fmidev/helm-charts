# Default values for mlflow.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

environment:
host:

mlflow:
  replicas: 1
  containerPort: 5000
  servicePort: 5000

  # NOTE: each of the 4 server workers has its own db connection pool,
  # keep 4 x (pool size + max overflow) x 2 pods (rolling update) below postgresql max_connections (100)
  extraEnv:
    - name: MLFLOW_SQLALCHEMYSTORE_POOL_SIZE
      value: "3"
    - name: MLFLOW_SQLALCHEMYSTORE_MAX_OVERFLOW
      value: "5"
    - name: MLFLOW_SQLALCHEMYSTORE_POOL_RECYCLE
      value: "3600"
    - name: MLFLOW_SQLALCHEMYSTORE_ECHO
      value: "false"

    # Disable job execution in production, see https://mlflow.org/docs/latest/tracking.html#job-execution
    # This feature serve the GenAI features, which classical ML users do not need.
    - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
      value: "false"

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"

  image:
    # https://github.com/mlflow/mlflow/pkgs/container/mlflow
    # The -full image already contains the auth, postgresql and s3 dependencies.
    repository: ghcr.io/mlflow/mlflow
    tag: ""  # defaults to v<appVersion>-full
    pullPolicy: IfNotPresent

# Basic-auth plugin, rendered into basic-auth.ini (templates/auth-config.yaml)
# https://mlflow.org/docs/latest/self-hosting/security/basic-http-auth/
auth:
  # Permission for any (user, resource) pair without an explicit grant. Explicit
  # grants (EDIT, MANAGE, but also NO_PERMISSIONS/DENY) still win.
  defaultPermission: READ
  adminUsername: admin
  # Admin password is only needed on the first start against an empty users database.
  # Optional secret with key "password".
  adminSecret: mlflow-admin-credentials
  # Secret with key SECRET_KEY, used for CSRF protection. Required.
  flaskSecret: flask-secret

# Workspaces: logical separation of experiments, models and prompts (mlflow server --enable-workspaces)
# Changes the permission model, test before enabling:
#  * an ungranted user gets no access in named workspaces
#  * creating experiments needs a workspace USE grant (e.g. the "user" role), READ is not enough
#  * existing resources stay in the "default" workspace (move them with `mlflow db move-resources`)
#  * clients select a workspace with the MLFLOW_WORKSPACE environment variable
workspaces:
  enabled: false
  # Users without a grant get auth.defaultPermission in the "default" workspace.
  # No effect while workspaces are disabled.
  grantDefaultAccess: true

# Garbage collection (mlflow gc) as a CronJob, see templates/gc-cronjob.yaml
# Permanently deletes runs/experiments/logged models users have deleted, including artifacts.
# NOTE: doesn't check registered models, a model version whose run was deleted loses its artifacts.
# Needs the admin password in auth.adminSecret (artifacts are deleted through the tracking server).
garbageCollection:
  enabled: false
  # true: the CronJob exists but never runs on schedule, run it manually instead
  suspend: true
  schedule: "0 3 * * 0"  # Sundays 03:00 UTC
  olderThan: 30d  # only resources deleted at least this long ago
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

route:
  # Router timeout, artifacts are proxied through the server so large uploads take time
  timeout: 5m

# Backups
recovery:
  enabled: false

  # ondemand backups use (recovering from a Backup object):
  # https://cloudnative-pg.io/documentation/1.27/recovery/#recovery-from-a-backup-object
  ondemand: false
  name:  # name of the manually created backup resource

  # scheduled backups use:
  # https://cloudnative-pg.io/documentation/1.27/appendixes/backup_barmanobjectstore/#recovery-from-an-object-store
  source: external-source  # dont change this
  serverName: pg-cluster-source  # name of the source cluster (where the backups are taken from)
  backupPath:  # s3 path of the source backups, defaults to objectStorage.s3.backupPath

# S3 storage for artifacts and backups
objectStorage:
  s3:
    secretName: s3-credentials
    bucketName:
    endpointUrl:
    artifactPath:
    backupPath:

# Cloudnative-pg configurations
postgresql:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  clusterName: pg-cluster
  database: app
  owner: app
  instances: 3
  storageSize: 3Gi
  # 1/4 of memory as suggested in https://www.postgresql.org/docs/current/runtime-config-resource.html
  parameters: {}
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  secrets:
    admin: postgresql-superuser-secret
    mlflow: postgresql-mlflow-secret
