apiVersion: v1
kind: Service
metadata:
  name: {{ include "mlflow.fullname" . }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mlflow.selectorLabels" . | nindent 4 }}

  ports:
    - protocol: TCP
      port: {{ .Values.mlflow.servicePort }}
      targetPort: {{ .Values.mlflow.containerPort }}
