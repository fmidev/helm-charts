apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mlflow.fullname" . }}-auth
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
data:
  # No secrets here: database credentials come from PGUSER/PGPASSWORD
  # and the admin password (first start only) from MLFLOW_AUTH_ADMIN_PASSWORD.
  basic-auth.ini: |
    [mlflow]
    default_permission = {{ .Values.auth.defaultPermission }}
    database_uri = postgresql://{{ include "mlflow.dbHost" . }}/users
    admin_username = {{ .Values.auth.adminUsername }}
    authorization_function = mlflow.server.auth:authenticate_request_basic_auth
    grant_default_workspace_access = {{ .Values.workspaces.grantDefaultAccess }}
