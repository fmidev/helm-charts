{{- if .Values.ingress.enabled }}
{{- if .Values.route.enabled }}
{{- fail "route.enabled and ingress.enabled cannot both be true" }}
{{- end }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.host must be provided when ingress.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "geoweb-plugin-registry.fullname" . }}
  labels:
    {{- include "geoweb-plugin-registry.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "geoweb-plugin-registry.fullname" . }}
                port:
                  name: http
{{- end }}
