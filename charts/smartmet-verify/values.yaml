nameOverride: ""
fullnameOverride: ""

commonLabels: {}
commonAnnotations: {}

# The default images are published publicly to GitHub Container Registry, so no
# pull secret is needed to deploy this chart as shipped. Set this only when
# pointing the image repositories at a registry that does require credentials --
# a private mirror, or an air-gapped copy.
imagePullSecrets: []
# Example:
# imagePullSecrets:
#   - name: pull-secret

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

global:
  imageRegistry: ""
  extraVolumes: []
  extraVolumeMounts: []

gui:
  enabled: false

  replicaCount: 1

  image:
    repository: ghcr.io/fmidev/fmi-verification-gui
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      memory: 3Gi
      cpu: 2
    limits:
      memory: 3Gi
      cpu: 2

  nodeSelector: {}
  tolerations: []
  affinity: {}

  podAnnotations: {}
  podLabels: {}

  springProfile: production

  env:
    - name: TZ
      value: "UTC"
    - name: JAVA_TOOL_OPTIONS
      value: "-DproductionMode=true -Dvaadin.productionMode -XX:ActiveProcessorCount=2"
    - name: JAVA_OPTS
      value: "-Duser.timezone=UTC -Dspring.config.additional-location=/var/app/config/ -Dspring.profiles.active=$(SPRING_PROFILES_ACTIVE)"
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []

  config:
    # Supported modes:
    # - secretFile:    mount one file from a Secret (recommended when full config is sensitive)
    # - configMapFile: mount one file from a ConfigMap (recommended when only the DB password
    #                  is sensitive; inject the password via extraEnv from a separate Secret)
    # - env:           import env vars from Secret/ConfigMap
    # - none:          do nothing
    mode: secretFile

    secretFile:
      secretName: ""
      secretKey: application.yaml
      mountPath: /var/app/config
      fileName: application.yaml

    configMapFile:
      configMapName: ""
      configMapKey: application.yaml
      mountPath: /var/app/config
      fileName: application.yaml

    envFrom:
      secretRefs: []
      configMapRefs: []

  persistence:
    logs:
      enabled: false
      accessModes:
        - ReadWriteOnce
      size: 5Gi
      storageClassName: ""
      mountPath: /var/log/tomcat

  # Writable /tmp mounted as emptyDir. Required when readOnlyRootFilesystem is
  # true (the default) because Tomcat and the JVM need to write to /tmp.
  tmpDir:
    enabled: true

  # Spring Boot Actuator management port. The app exposes /actuator/health on
  # this port (separate from the main HTTP port so Spring Security does not
  # apply). Must match management.server.port in the app's application.yaml.
  managementPort: 8081

  # Probe action. By default httpGet against the management port.
  # Set one of `httpGet`, `tcpSocket` or `exec` to override.
  probes:
    liveness:
      enabled: true
      httpGet:
        path: /actuator/health/liveness
        port: management
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    readiness:
      enabled: true
      httpGet:
        path: /actuator/health/readiness
        port: management
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6

  ingress:
    enabled: false
    className: ""
    annotations: {}
    customAnnotations: {}
    hosts:
      - host: smartmet-verify-gui.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  route:
    enabled: false
    annotations: {}
    host: ""
    tls:
      enabled: true
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

runner:
  enabled: false

  replicaCount: 1

  image:
    repository: ghcr.io/fmidev/fmi-verification-runner
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      memory: 6Gi
      cpu: 2
    limits:
      memory: 6Gi
      cpu: 2

  nodeSelector: {}
  tolerations: []
  affinity: {}

  podAnnotations: {}
  podLabels: {}

  springProfile: production

  env:
    - name: TZ
      value: "UTC"
    - name: JAVA_TOOL_OPTIONS
      value: "-XX:ActiveProcessorCount=2"
    - name: JAVA_OPTS
      value: "-Duser.timezone=UTC -Dspring.config.additional-location=/var/app/config/ -Dspring.profiles.active=$(SPRING_PROFILES_ACTIVE)"
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []

  config:
    mode: secretFile

    secretFile:
      secretName: ""
      secretKey: application.yaml
      mountPath: /var/app/config
      fileName: application.yaml

    configMapFile:
      configMapName: ""
      configMapKey: application.yaml
      mountPath: /var/app/config
      fileName: application.yaml

    envFrom:
      secretRefs: []
      configMapRefs: []

  persistence:
    logs:
      enabled: false
      accessModes:
        - ReadWriteOnce
      size: 5Gi
      storageClassName: ""
      mountPath: /var/log/tomcat

  tmpDir:
    enabled: true

  # Spring Boot Actuator management port. Must match management.server.port
  # in the app's application.yaml.
  #
  # 8082, not the GUI's 8081: the runner sets management.server.port: 8082 so
  # the two do not collide on a host where both share a network namespace.
  # Aligning this with the GUI's value points the probes at a closed port.
  managementPort: 8082

  # Probe action. By default httpGet against the management port.
  # Set one of `httpGet`, `tcpSocket` or `exec` to override.
  probes:
    liveness:
      enabled: true
      httpGet:
        path: /actuator/health/liveness
        port: management
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 6
    readiness:
      enabled: true
      httpGet:
        path: /actuator/health/readiness
        port: management
      initialDelaySeconds: 20
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 6

# Optional model data loader: reads model forecasts from a SmartMet Server EDR API and writes them
# into model_data. Off by default -- FMI fills that table another way, so only deployments that
# rely on the EDR loader (e.g. international ones) enable it.
loader:
  enabled: false

  image:
    repository: ghcr.io/fmidev/fmi-verification-loader
    tag: ""
    pullPolicy: IfNotPresent

  # The verification database. jdbcUrl, not url: the app binds a Hikari DataSource by its own
  # property names. In-cluster this is the CNPG service; the password comes from a secret.
  db:
    jdbcUrl: jdbc:postgresql://verification-db:5432/verifapi
    username: verifrun
    passwordSecret:
      name: smartmet-verify-loader-db-password
      key: password

  edr:
    # SmartMet Server EDR endpoint, in-cluster DNS (<service>.<namespace>), not the public name.
    baseUrl: ""

  # Ephemeral spool by default (emptyDir). Enable persistence to keep spooled runs across a pod
  # reschedule -- worth it where a maintenance window can outlast the EDR's short instance
  # retention. mountPath must match loader.spool.path in the application config.
  # Writable /tmp for the embedded servlet container under the read-only root filesystem.
  tmpDir:
    enabled: true

  # The spool holds forecasts fetched while the verification database was unavailable, replayed
  # when it returns. Persistent by default: an emptyDir spool is discarded on a pod reschedule,
  # which loses precisely the runs it exists to protect -- and the loader only spools at all for an
  # outage longer than EDR's instance retention, so those runs cannot simply be re-fetched.
  #
  # mountPath must match loader.spool.path in the application config, and size should match
  # loader.spool.max-size, which is the cap the application evicts against.
  spool:
    mountPath: /var/spool/verification-loader
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 5Gi
      # Empty -> the cluster's default StorageClass.
      storageClassName: ""

  resources:
    requests:
      memory: 1Gi
      cpu: "1"
    limits:
      memory: 1Gi
      cpu: "1"

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

  # Spring Boot Actuator management port. Must match management.server.port in the loader's
  # application.yaml. 8083: the GUI holds 8081 and the runner 8082, so all three can share a
  # network namespace without colliding.
  managementPort: 8083

  # Liveness only. The loader answers no application traffic and has no Service, so readiness
  # gates nothing; a loader that cannot momentarily reach EDR or the database is still healthy and
  # retrying, and must not be marked unready for it. Liveness catches a wedged process.
  probes:
    liveness:
      enabled: true
      httpGet:
        path: /actuator/health/liveness
        port: management
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 6
    readiness:
      enabled: false
      httpGet:
        path: /actuator/health/readiness
        port: management
