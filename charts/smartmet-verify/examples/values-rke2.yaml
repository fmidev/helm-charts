
gui:
  enabled: true
  image:
    tag: "1.2.3"
  config:
    secretFile:
      secretName: smartmet-verify-gui-config
  persistence:
    logs:
      enabled: true
      size: 5Gi

  # The GUI listens on HTTP port 8080 when its application.yaml sets
  # `security.require-ssl: false` (recommended for cluster-internal traffic).
  # With Spring Security protecting /actuator/**, fall back to tcpSocket probes
  # unless the "noauth" profile is active or the health endpoints are permitted.
  probes:
    liveness:
      tcpSocket:
        port: http
    readiness:
      tcpSocket:
        port: http

  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: verification.example.org
        paths:
          - path: /
            pathType: Prefix

runner:
  enabled: true
  image:
    tag: "1.2.3"

  config:
    mode: secretFile
    secretFile:
      secretName: smartmet-verify-runner-config

  persistence:
    logs:
      enabled: true
      storageClassName: local-path
