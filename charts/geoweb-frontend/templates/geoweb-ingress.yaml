{{- if .Values.ingress.customAnnotations }}
{{- fail "ingress.customAnnotations has been renamed to ingress.annotations. Note that ingress.annotations is merged with the chart's default nginx annotations, set a default annotation to null to remove it." }}
{{- end }}
{{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
{{- if .Values.frontend.auth_secret }}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/auth-type" "basic" }}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/auth-secret" .Values.frontend.auth_secretName }}
{{- end }}
{{- if .Values.ingress.rules }}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/configuration-snippet" .Values.ingress.rules }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.name }}-{{ .Values.frontend.name }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
{{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
{{- end }}
{{- if .Values.ingress.tls }}
  tls: {{ toYaml .Values.ingress.tls | nindent 4 }}
{{- end }}
  rules:
    - host: {{ .Values.frontend.url }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.frontend.name }}
                port:
                  number: {{ .Values.frontend.svcPort }}