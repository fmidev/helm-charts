{{- if .Values.ingress.customAnnotations }}
{{- fail "ingress.customAnnotations has been renamed to ingress.annotations" }}
{{- end }}
{{- if .Values.ingress.rules }}
{{- fail "ingress.rules was removed. Set the snippet as an ingress.annotations entry for your ingress controller, for example nginx.ingress.kubernetes.io/configuration-snippet" }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.frontend.auth_secret (not .Values.ingress.annotations) }}
{{- fail "frontend.auth_secret no longer adds basic auth annotations to the Ingress. Set them in ingress.annotations, for example nginx.ingress.kubernetes.io/auth-type: basic and nginx.ingress.kubernetes.io/auth-secret: <frontend.auth_secretName>" }}
{{- end }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.name }}-{{ .Values.frontend.name }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
{{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
{{- end }}
{{- if .Values.ingress.tls }}
  tls: {{ toYaml .Values.ingress.tls | nindent 4 }}
{{- end }}
  rules:
    - host: {{ .Values.frontend.url }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.frontend.name }}
                port:
                  number: {{ .Values.frontend.svcPort }}
{{- end }}
