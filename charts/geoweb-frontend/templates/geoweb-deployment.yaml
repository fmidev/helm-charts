{{- if hasKey .Values.frontend "customConfiguration" -}}
{{- fail "frontend.customConfiguration was removed; use frontend.runtimeConfiguration" -}}
{{- end -}}
{{- $runtimeSource := default "none" .Values.frontend.runtimeConfiguration.source -}}
{{- if not (has $runtimeSource (list "none" "inline" "existingConfigMap")) -}}
{{- fail "frontend.runtimeConfiguration.source must be none, inline, or existingConfigMap" -}}
{{- end -}}
{{- if and .Values.frontend.useCustomConfigurationFiles (ne $runtimeSource "none") -}}
{{- fail "frontend.useCustomConfigurationFiles cannot be combined with frontend.runtimeConfiguration.source" -}}
{{- end -}}
{{- if and (eq $runtimeSource "existingConfigMap") (or (empty .Values.frontend.runtimeConfiguration.existingConfigMap.name) (empty .Values.frontend.runtimeConfiguration.existingConfigMap.checksum)) -}}
{{- fail "frontend.runtimeConfiguration.existingConfigMap.name and checksum are required" -}}
{{- end -}}
{{- if and (eq $runtimeSource "inline") (empty .Values.frontend.runtimeConfiguration.files) -}}
{{- fail "frontend.runtimeConfiguration.files is required for inline source" -}}
{{- end -}}
{{- $nginx := default dict .Values.frontend.nginx -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.name }}
  labels:
    app: {{ .Values.frontend.name }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.frontend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.frontend.name }}
      annotations:
        eks.amazonaws.com/compute-type: ec2
      {{- if .Values.frontend.commitHash }}
        commitHash: {{ .Values.frontend.commitHash }}
      {{- end }}
      {{- if eq $runtimeSource "inline" }}
        checksum/runtime-configuration: {{ .Values.frontend.runtimeConfiguration.files | toJson | sha256sum | quote }}
      {{- else if eq $runtimeSource "existingConfigMap" }}
        checksum/runtime-configuration: {{ .Values.frontend.runtimeConfiguration.existingConfigMap.checksum | quote }}
      {{- end }}
      {{- with $nginx.headers }}
        checksum/nginx-headers: {{ default "" .config | sha256sum | quote }}
      {{- end }}
    spec:
    {{- if eq .Values.secretProvider "aws" }}
      serviceAccountName: {{ .Values.frontend.secretServiceAccount }}
    {{- end }}
    {{- if and .Values.frontend.useCustomConfigurationFiles (eq .Values.frontend.customConfigurationLocation "s3")}}
      initContainers:
      - name: init
        image: amazon/aws-cli
        command: ["/bin/sh"]
        args:
          - -c
          - |
            export AWS_ACCESS_KEY_ID={{ .Values.frontend.awsAccessKeyId }};
            export AWS_SECRET_ACCESS_KEY={{ .Values.frontend.awsAccessKeySecret }};
            export AWS_DEFAULT_REGION={{ .Values.frontend.awsDefaultRegion }};
            aws s3 cp --recursive --exclude "*/*" s3://{{ .Values.frontend.s3bucketName }}{{ .Values.frontend.customConfigurationFolderPath }} /frontend;
        volumeMounts:
        - mountPath: "/frontend/"
          name: {{ .Values.frontend.name }}-volume
    {{- end }}
      containers:
      - name: {{ .Values.frontend.name }}
        image: {{ .Values.frontend.registry }}:{{ default .Chart.AppVersion .Values.versions.frontend }}
      {{- if .Values.frontend.imagePullPolicy }}
        imagePullPolicy: {{ .Values.frontend.imagePullPolicy }}
      {{- end }}
        ports:
        - containerPort: {{ .Values.frontend.containerPort }}
      {{- if .Values.frontend.resources }}
        resources: {{ toYaml .Values.frontend.resources | nindent 10 }}
      {{- end }}
      {{- if .Values.frontend.startupProbe }}
        startupProbe: {{ toYaml .Values.frontend.startupProbe | nindent 10 }}
      {{- end }}
      {{- if .Values.frontend.livenessProbe }}
        livenessProbe: {{ toYaml .Values.frontend.livenessProbe | nindent 10 }}
      {{- end }}
      {{- if .Values.frontend.readinessProbe }}
        readinessProbe: {{ toYaml .Values.frontend.readinessProbe | nindent 10 }}
      {{- end }}
        envFrom:
        - configMapRef:
            name: {{ .Values.frontend.name }}
      {{- if .Values.frontend.client_id_secret }}
        env:
        - name: GW_AUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.frontend.client_id_secretName }}
              key: GW_AUTH_CLIENT_ID
      {{- end }}
      {{- if or $nginx.headers .Values.secretProvider .Values.frontend.useCustomConfigurationFiles (ne $runtimeSource "none") }}
        volumeMounts:
      {{- with $nginx.headers }}
        - name: nginx-headers
          mountPath: {{ default "/etc/nginx/headers.conf" .mountPath | quote }}
          subPath: headers.conf
          readOnly: true
      {{- end }}
      {{- if .Values.secretProvider }}
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
      {{- end }}
      {{- if and .Values.frontend.useCustomConfigurationFiles }}
        - mountPath: {{ .Values.frontend.customConfigurationMountPath }}
          name: {{ .Values.frontend.name }}-volume
      {{- end }}
      {{- if ne $runtimeSource "none" }}
        - name: generated-configs
          mountPath: {{ .Values.frontend.runtimeConfiguration.mountPath }}
          readOnly: true
      {{- end }}
      {{- end }}
    {{- if or $nginx.headers .Values.secretProvider .Values.frontend.useCustomConfigurationFiles (ne $runtimeSource "none") }}
      volumes:
      {{- with $nginx.headers }}
      - name: nginx-headers
        configMap:
          name: {{ $.Values.frontend.name }}-nginx-headers
      {{- end }}
      {{- if .Values.frontend.useCustomConfigurationFiles }}
      - name: {{ .Values.frontend.name }}-volume
      {{- if eq .Values.frontend.customConfigurationLocation "s3"}}
        emptyDir: {}
      {{- else if eq .Values.frontend.customConfigurationLocation "local"}}
        persistentVolumeClaim:
          claimName: {{ .Values.frontend.name }}-claim
      {{- end }}
      {{- end }}
      {{- if ne $runtimeSource "none" }}
      - name: generated-configs
        configMap:
          name: {{ ternary .Values.frontend.runtimeConfiguration.existingConfigMap.name (printf "%s-runtime-config" .Values.frontend.name) (eq $runtimeSource "existingConfigMap") }}
      {{- end }}
      {{- if .Values.secretProvider }}
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: {{ .Values.frontend.spcName | quote }}
      {{- end }}
    {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - {{ .Values.frontend.name }}
              topologyKey: topology.kubernetes.io/zone
