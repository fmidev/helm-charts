apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ include "harp.fullname" . }}
  labels:
    {{- include "harp.labels" . | nindent 4 }}
spec:
  lookupPolicy:
    local: false
  tags:
    - name: {{ .Values.images.harpvis.tag | default "latest" | quote }}
      from:
        kind: DockerImage
        name: "{{ .Values.images.harpvis.repository }}:{{ .Values.images.harpvis.tag | default "latest" }}"
      importPolicy:
        scheduled: {{ .Values.imageStream.scheduled }}
      referencePolicy:
        type: Local
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ .Values.sftp.image.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sftp-puller.labels" . | nindent 4 }}
spec:
  lookupPolicy:
    local: true
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: harpverif
  labels:
    {{- include "harp.labels" . | nindent 4 }}
spec:
  lookupPolicy:
    local: false
  tags:
    - name: {{ .Values.images.harpverif.tag | default "latest" | quote }}
      from:
        kind: DockerImage
        name: "{{ .Values.images.harpverif.repository }}:{{ .Values.images.harpverif.tag | default "latest" }}"
      importPolicy:
        scheduled: {{ .Values.imageStream.scheduled }}
      referencePolicy:
        type: Local
