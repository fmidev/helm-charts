{{- if .Values.routes }}
{{- range $name, $route := .Values.routes }}
{{- if $route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    type: {{ $route.type }}
  {{- if $route.annotations }}
  annotations:
{{ toYaml $route.annotations | indent 4 }}
  {{- end }}
spec:
  host: {{ $route.host }}
  {{- if $route.path }}
  path: {{ $route.path }}
  {{- end }}
  port:
    targetPort: {{ $route.targetPort  }}
  to:
    kind: Service
    name: {{ $route.targetService }}
    weight: 100
  wildcardPolicy: None
  {{- if $route.tls }}
  tls:
    termination: {{ $route.tls.termination }}
    insecureEdgeTerminationPolicy: {{ $route.tls.insecureEdgeTerminationPolicy }}
    {{- with $route.tls.externalCertificate }}
    externalCertificate:
      name: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $certs := list }}
{{- range $name, $route := .Values.routes }}
{{- if and $route.enabled $route.tls $route.tls.externalCertificate }}
{{- $certs = append $certs $route.tls.externalCertificate }}
{{- end }}
{{- end }}
{{- if $certs }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cert-reader
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: {{ $certs | uniq | sortAlpha | toJson }}
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cert-reader
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-cert-reader
subjects:
- kind: ServiceAccount
  name: router
  namespace: openshift-ingress
{{- end }}
