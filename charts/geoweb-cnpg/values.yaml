name: geoweb-db

helm:
  resourcePolicy: keep

cluster:
  instances: 1
  affinity:
    # Spread instances across nodes when possible. Use required only when every
    # environment has enough schedulable topology domains for all instances.
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  # Full CNPG-compatible PostgreSQL image reference. Empty uses the operator's
  # default image. Pin a tag or digest in production to select the version.
  imageName: ""
  # Use supervised to require an operator-triggered primary switchover during
  # rolling updates after all replicas have been updated.
  primaryUpdateStrategy: unsupervised
  bootstrap:
    # Supported values: initdb, recovery
    mode: initdb
    initdb:
      # Initial application database and its login/owner role.
      # Empty uses the Cluster name.
      database: ""
      owner: geoweb
    recovery:
      # Set exactly one of source or backupName.
      source: ""
      backupName: ""
      # Required chart inputs defining the application database and owner after
      # recovery. CNPG creates or reconciles them if necessary.
      database: ""
      owner: geoweb
      # Leave empty to let CNPG generate new application credentials.
      secretName: ""
      recoveryTarget: {}
      barmanCloud:
        # ObjectStore containing the source cluster's backups and WAL archive.
        objectStoreName: ""
        # Source archive server name. Set explicitly when restoring under a new
        # Cluster name; empty uses the restored Cluster name.
        serverName: ""
      # Deprecated native object-store recovery configuration. Set this or
      # barmanCloud.objectStoreName for source recovery, never both, and
      # neither with backupName.
      # Uses CNPG's barmanObjectStore fields, including destinationPath,
      # credentials, and serverName (empty/omitted uses source).
      # Set null in a values overlay to remove native recovery configuration.
      barmanObjectStore: {}
  storage:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

backup:
  # Supported values: none, volumeSnapshot, barmanCloud, barmanObjectStore
  method: none
  target: prefer-standby
  schedule: "0 0 0 * * *"
  immediate: true
  suspend: false
  # Keep backup resources independent from both the schedule and Cluster.
  backupOwnerReference: none
  # Native barmanObjectStore only. Recovery window, e.g. 30d, 4w, or 2m.
  # Empty leaves retention unmanaged by CNPG.
  retentionPolicy: ""
  volumeSnapshot:
    className: ""
    online: true
    snapshotOwnerReference: none
  barmanCloud:
    # ObjectStore used for base backups and continuous WAL archiving.
    objectStoreName: ""
    # Archive server name. Empty uses the Cluster name. Preserve a custom native
    # barmanObjectStore.serverName here when migrating to the plugin.
    serverName: ""
  # Deprecated native integration, for clusters without the Barman plugin.
  # Passed directly to spec.backup.barmanObjectStore. Requires destinationPath
  # and a PostgreSQL image containing barman-cli-cloud. See README for S3 setup.
  # Only allowed with method barmanObjectStore; set null in a values overlay to
  # remove it when switching methods.
  barmanObjectStore: {}
