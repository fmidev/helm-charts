versions:
  presets:

presets:
  name: presets
  registry: registry.gitlab.com/opengeoweb/backend-services/presets-backend/presets-backend
  path: /presets/(.*)
  svcPort: 80
  replicas: 1
  minPodsAvailable: 0
  PRESETS_PORT_HTTP: 8080
  DEPLOY_ENVIRONMENT: open
  postStartCommand: bin/admin.sh
  secretServiceAccount: presets-service-account
  resources:
    requests:
      memory: "384Mi"
      cpu: "15m"
    limits:
      memory: "2048Mi"
  startupProbe:
    httpGet:
      path: /healthcheck?startup=true
      port: 8080
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 24  # Allow 4 minutes for startup
  livenessProbe:
    httpGet:
      path: /
      port: 8080
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 2
  readinessProbe:
    httpGet:
      path: /healthcheck?readiness=true
      port: 8080
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 1
  env:
    APPLICATION_ROOT_PATH: "/presets"
  nginx:
    name: nginx
    registry: registry.gitlab.com/opengeoweb/backend-services/auth-backend/auth-backend
    version: "v0.7.2"
    ENABLE_SSL: "FALSE"
    BACKEND_HOST: 0.0.0.0:8080
    NGINX_PORT_HTTP: 80
    NGINX_PORT_HTTPS: 443
    ENV_VAR_STRICT_MODE: "FALSE"
    resources:
      requests:
        memory: "16Mi"
        cpu: "5m"
      limits:
        memory: "32Mi"
    startupProbe:
      httpGet:
        path: /health_check?startup=true
        port: 80
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12  # Allow a minute for startup
    livenessProbe:
      httpGet:
        path: /health_check
        port: 80
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    readinessProbe:
      httpGet:
        path: /health_check?readiness=true
        port: 80
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 1
  db:
    # Database mode. Supported values:
    # - sidecar: run the default postgres container in the presets pod
    # - external: read PRESETS_BACKEND_DB from an externally managed connection string Secret
    # - zalando: create/use a Zalando Postgres operator database
    # - cloudnativepg: create/use a CloudNativePG Cluster
    mode: sidecar
    name: presets-db
    databaseName: presets
    username: geoweb
    sidecar:
      image: postgres
      port: 5432
      password: postgres
    external:
      secretName: presets-db
      secretKey: PRESETS_BACKEND_DB
      encodedConnectionString: cG9zdGdyZXNxbDovL2dlb3dlYjpwb3N0Z3Jlc0Bsb2NhbGhvc3Q6NTQzMi9wcmVzZXRz
      secretProvider:
        provider: ""
        className: presets-spc
        objectName: ""
        objectType: secretsmanager
        path: ""
        key: ""
        iamRoleARN: ""
        parameters: {}
    zalando:
      teamId: geoweb
      postgresVersion: 15
      instances: 1
      volumeSize: 100Mi
      enableLogicalBackup: true
      clone:
        enabled: false
        timestamp: "2030-01-01T00:00:00+00:00"
        backupBucket: ""
    cloudNativePG:
      instances: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      bootstrap:
        userSecretName: presets-db-user
        password: postgres
      storage:
        size: 1Gi
        className: ""
  useCustomConfigurationFiles: false
  customConfigurationLocation: local
  useCustomWorkspacePresets: false
  customWorkspacePresetLocation: local
  volumeAccessMode: ReadOnlyMany
  volumeSize: 100Mi

ingress:
  name: nginx-ingress-controller
  ingressClassName: nginx
