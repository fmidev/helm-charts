{{- $dbMode := default "sidecar" .Values.presets.db.mode }}
{{- if not (has $dbMode (list "sidecar" "external" "zalando")) }}
{{- fail "presets.db.mode must be one of: sidecar, external, zalando" }}
{{- end }}
{{- if or (hasKey .Values.presets "db_secret") (hasKey .Values.presets "db_secretName") (hasKey .Values.presets "db_secretType") (hasKey .Values.presets "db_secretPath") (hasKey .Values.presets "db_secretKey") }}
{{- fail "presets.db_secret* values were removed in chart 3.0.0. Use presets.db.external.* instead." }}
{{- end }}
{{- if or (hasKey .Values "secretProvider") (hasKey .Values "secretProviderParameters") (hasKey .Values.presets "iamRoleARN") }}
{{- fail "Legacy secret provider values were removed in chart 3.0.0. Use presets.db.external.secretProvider.* instead." }}
{{- end }}
{{- if or (hasKey .Values.presets.db "enableDefaultDb") (hasKey .Values.presets.db "useZalandoOperatorDb") (hasKey .Values.presets.db "POSTGRES_DB") (hasKey .Values.presets.db "POSTGRES_USER") (hasKey .Values.presets.db "POSTGRES_PASSWORD") (hasKey .Values.presets.db "POSTGRES_VERSION") (hasKey .Values.presets.db "numberOfInstances") (hasKey .Values.presets.db "instanceSize") (hasKey .Values.presets.db "zalandoTeamId") (hasKey .Values.presets.db "enableLogicalBackup") (hasKey .Values.presets.db "cleanInstall") (hasKey .Values.presets.db "backupTimestamp") (hasKey .Values.presets.db "backupBucket") }}
{{- fail "Legacy presets.db values were removed in chart 3.0.0. Set presets.db.mode and migrate database settings using the README migration map." }}
{{- end }}
{{- if eq $dbMode "zalando" }}
apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: {{ .Values.presets.db.name }}
spec:
  teamId: {{ .Values.presets.db.zalando.teamId }}
  volume:
    size: {{ .Values.presets.db.zalando.volumeSize }}
  numberOfInstances: {{ .Values.presets.db.zalando.instances }}
  users:
    {{ .Values.presets.db.username }}:
    - superuser
    - createdb
  databases:
    {{ .Values.presets.db.databaseName }}: {{ .Values.presets.db.username }}
  postgresql:
    version: {{ .Values.presets.db.zalando.postgresVersion | quote }}
  enableLogicalBackup: {{ .Values.presets.db.zalando.enableLogicalBackup }}
  {{- if .Values.presets.db.zalando.clone.enabled }}
  clone:
    cluster: {{ .Values.presets.db.name | quote }}
    timestamp: {{ .Values.presets.db.zalando.clone.timestamp | quote }}
    s3_wal_path: {{ .Values.presets.db.zalando.clone.backupBucket | quote }}
  {{- end }}
{{- end }}
