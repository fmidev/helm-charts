{{- if and .Values.presets.useCustomConfigurationFiles (eq .Values.presets.customConfigurationLocation "inline") }}
{{- $files := .Values.presets.customConfigurationFiles -}}
{{- if not (kindIs "map" $files) -}}
{{- fail "presets.customConfigurationFiles must map filenames to plain-text strings" -}}
{{- end -}}
{{- if empty (get $files "nginx.conf") -}}
{{- fail "presets.customConfigurationFiles.nginx.conf is required for inline configuration" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.presets.name }}-configuration
data:
{{- range $filename, $content := $files }}
  {{- if or (not (regexMatch "^[A-Za-z0-9._-]+$" $filename)) (not (kindIs "string" $content)) -}}
  {{- fail "presets.customConfigurationFiles must map valid ConfigMap keys to plain-text strings" -}}
  {{- end }}
  {{ $filename | quote }}: {{ $content | quote }}
{{- end }}
{{- end }}
