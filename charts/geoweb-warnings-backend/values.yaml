versions:
  warnings:

warnings:
  name: warnings
  registry: registry.gitlab.com/opengeoweb/backend-services/warnings-backend/warnings-backend
  path: /warnings-backend/(.*)
  svcPort: 80
  replicas: 1
  minPodsAvailable: 0
  secretServiceAccount: warnings-service-account
  resources:
    requests:
      memory: "512Mi"
      cpu: "15m"
    limits:
      memory: "1024Mi"
  startupProbe:
    httpGet:
      path: /healthcheck?startup=true
      port: 8080
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 24  # Allow 4 minutes for startup
  livenessProbe:
    httpGet:
      path: /
      port: 8080
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 2
  readinessProbe:
    httpGet:
      path: /healthcheck?readiness=true
      port: 8080
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 1
  env:
    WARNINGS_PORT_HTTP: 8080
    APPLICATION_ROOT_PATH: /warnings-backend
  nginx:
    name: warnings-nginx
    registry: registry.gitlab.com/opengeoweb/backend-services/auth-backend/auth-backend
    version: "v0.6.0"
    ENABLE_SSL: "FALSE"
    BACKEND_HOST: 0.0.0.0:8080
    NGINX_PORT_HTTP: 80
    NGINX_PORT_HTTPS: 443
    ENV_VAR_STRICT_MODE: "FALSE"
    resources:
      requests:
        memory: "16Mi"
        cpu: "5m"
      limits:
        memory: "32Mi"
    startupProbe:
      httpGet:
        path: /health_check?startup=true
        port: 80
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12  # Allow a minute for startup
    livenessProbe:
      httpGet:
        path: /health_check
        port: 80
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    readinessProbe:
      httpGet:
        path: /health_check?readiness=true
        port: 80
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 1
  db:
    # Database mode. Supported values:
    # - sidecar: run the default postgres container in the warnings pod
    # - external: read WARNINGS_BACKEND_DB from an externally managed connection string Secret
    # - zalando: create/use a Zalando Postgres operator database
    mode: sidecar
    name: warnings-db
    databaseName: warnings
    username: geoweb
    sidecar:
      image: postgres
      port: 5432
      password: postgres
    external:
      # Supported values: inline, secretProvider, existingSecret
      source: inline
      secretName: warnings-db
      secretKey: WARNINGS_BACKEND_DB
      encodedConnectionString: ""
      secretProvider:
        provider: ""
        className: warnings-spc
        objectName: ""
        # Defaults to secretsmanager for AWS and secret for Azure.
        objectType: ""
        path: ""
        key: ""
        iamRoleARN: ""
        parameters: {}
    zalando:
      teamId: geoweb
      postgresVersion: 15
      instances: 1
      volumeSize: 100Mi
      enableLogicalBackup: true
      clone:
        enabled: false
        timestamp: ""
        backupBucket: ""
  useCustomConfigurationFiles: false
  customConfigurationLocation: local
  volumeAccessMode: ReadOnlyMany
  volumeSize: 100Mi

ingress:
  name: nginx-ingress-controller
  ingressClassName: nginx
