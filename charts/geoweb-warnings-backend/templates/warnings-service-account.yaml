{{- $dbUsesAws := and (eq .Values.warnings.db.mode "external") (eq .Values.warnings.db.external.source "secretProvider") (eq .Values.warnings.db.external.secretProvider.provider "aws") }}
{{- if $dbUsesAws }}
{{- if not .Values.warnings.secretServiceAccount }}
{{- fail "warnings.secretServiceAccount is required when an AWS secret provider is used" }}
{{- end }}
{{- if not .Values.warnings.db.external.secretProvider.iamRoleARN }}
{{- fail "warnings.db.external.secretProvider.iamRoleARN is required when an AWS secret provider is used" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.warnings.secretServiceAccount }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.warnings.db.external.secretProvider.iamRoleARN }}
{{- end }}
