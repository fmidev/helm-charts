{{- $dbMode := default "sidecar" .Values.warnings.db.mode }}
{{- $usesExternalSecretProvider := and (eq $dbMode "external") (eq (default "inline" .Values.warnings.db.external.source) "secretProvider") }}
{{- $managedEnv := ternary (list "PG_PASS" "PG_USER" "WARNINGS_BACKEND_DB") (list "WARNINGS_BACKEND_DB") (eq $dbMode "zalando") }}
{{- $backendEnv := dict "VERSION" (default .Chart.AppVersion .Values.versions.warnings) }}
{{- range $key, $value := .Values.warnings.env }}
{{- $_ := set $backendEnv (upper $key) $value }}
{{- end }}
{{- $nginx := .Values.warnings.nginx }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.warnings.name }}
  labels:
    app: {{ .Values.warnings.name }}
spec:
  replicas: {{ .Values.warnings.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.warnings.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.warnings.name }}
      annotations:
        eks.amazonaws.com/compute-type: ec2
      {{- if .Values.warnings.commitHash }}
        commitHash: {{ .Values.warnings.commitHash }}
      {{- end }}
    spec:
    {{- if and $usesExternalSecretProvider (eq .Values.warnings.db.external.secretProvider.provider "aws") }}
      serviceAccountName: {{ .Values.warnings.secretServiceAccount }}
    {{- else }}
      serviceAccountName: default
    {{- end }}
      initContainers:
    {{- if and .Values.warnings.useCustomConfigurationFiles (eq .Values.warnings.customConfigurationLocation "s3")}}
      - name: init
        image: amazon/aws-cli
        command: ["/bin/sh"]
        args:
          - -c
          - |
            export AWS_ACCESS_KEY_ID={{ .Values.warnings.awsAccessKeyId }};
            export AWS_SECRET_ACCESS_KEY={{ .Values.warnings.awsAccessKeySecret }};
            export AWS_DEFAULT_REGION={{ .Values.warnings.awsDefaultRegion }};
            aws s3 cp --recursive --exclude "*/*" s3://{{ .Values.warnings.s3bucketName }}{{ .Values.warnings.customConfigurationFolderPath }} /warnings;
        volumeMounts:
        - mountPath: "/warnings/"
          name: {{ .Values.warnings.name }}-volume
    {{- end }}
      containers:
      - name: {{ .Values.warnings.name }}
        image: {{ .Values.warnings.registry }}:{{ default .Chart.AppVersion .Values.versions.warnings }}
      {{- if .Values.warnings.imagePullPolicy }}
        imagePullPolicy: {{ .Values.warnings.imagePullPolicy }}
      {{- end }}
        command: 
        - /bin/sh
        - -c
        - |
          while ! python3 -c "
          import os
          from sqlalchemy import create_engine
          engine = create_engine(os.environ['WARNINGS_BACKEND_DB'])
          engine.connect()
          " 2>/dev/null; do
            echo "Waiting for database connection..."
            sleep 5
          done && bin/admin.sh && exec bin/start.sh
        ports:
        - containerPort: {{ .Values.warnings.env.WARNINGS_PORT_HTTP }}
      {{- if .Values.warnings.resources }}
        resources: {{ toYaml .Values.warnings.resources | nindent 10 }}
      {{- end }}
      {{- if .Values.warnings.startupProbe }}
        startupProbe: {{ toYaml .Values.warnings.startupProbe | nindent 10 }}
      {{- end }}
      {{- if .Values.warnings.livenessProbe }}
        livenessProbe: {{ toYaml .Values.warnings.livenessProbe | nindent 10 }}
      {{- end }}
      {{- if .Values.warnings.readinessProbe }}
        readinessProbe: {{ toYaml .Values.warnings.readinessProbe | nindent 10 }}
      {{- end }}
        env:
      {{- range $key, $value := $backendEnv }}
      {{- if not (has $key $managedEnv) }}
        - name: {{ $key }}
          value: {{ include "geoweb-warnings-backend.envValue" $value }}
      {{- end }}
      {{- end }}
      {{- if eq $dbMode "zalando" }}
        - name: PG_PASS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.warnings.db.username }}.{{ .Values.warnings.db.name }}.credentials.postgresql.acid.zalan.do
              key: password
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.warnings.db.username }}.{{ .Values.warnings.db.name }}.credentials.postgresql.acid.zalan.do
              key: username
      {{- end }}
        - name: WARNINGS_BACKEND_DB
        {{- if eq $dbMode "zalando" }}
          value: "postgresql://$(PG_USER):$(PG_PASS)@{{ .Values.warnings.db.name }}:5432/{{ .Values.warnings.db.databaseName }}"
        {{- else if eq $dbMode "sidecar" }}
          value: "postgresql://{{ .Values.warnings.db.username | urlquery | replace "+" "%20" }}:{{ .Values.warnings.db.sidecar.password | urlquery | replace "+" "%20" }}@localhost:{{ .Values.warnings.db.sidecar.port }}/{{ .Values.warnings.db.databaseName | urlquery | replace "+" "%20" }}"
        {{- else }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.warnings.db.external.secretName }}
              key: {{ .Values.warnings.db.external.secretKey }}
        {{- end }}
      {{- if $usesExternalSecretProvider }}
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
      {{- end }}
      - name: {{ .Values.warnings.nginx.name }}
        image: {{ .Values.warnings.nginx.registry }}:{{ default .Values.warnings.nginx.version }}
      {{- if .Values.warnings.imagePullPolicy }}
        imagePullPolicy: {{ .Values.warnings.imagePullPolicy }}
      {{- end }}
        ports:
        - containerPort: {{ .Values.warnings.nginx.NGINX_PORT_HTTP }}
      {{- if .Values.warnings.nginx.resources }}
        resources: {{ toYaml .Values.warnings.nginx.resources | nindent 10 }}
      {{- end }}
      {{- if .Values.warnings.nginx.startupProbe }}
        startupProbe: {{ toYaml .Values.warnings.nginx.startupProbe | nindent 10 }}
      {{- end }}
      {{- if .Values.warnings.nginx.livenessProbe }}
        livenessProbe: {{ toYaml .Values.warnings.nginx.livenessProbe | nindent 10 }}
      {{- end }}
      {{- if .Values.warnings.nginx.readinessProbe }}
        readinessProbe: {{ toYaml .Values.warnings.nginx.readinessProbe | nindent 10 }}
      {{- end }}
        env:
      {{- range $name := list "ENABLE_SSL" "OAUTH2_USERINFO" "JWKS_URI" "AUD_CLAIM" "AUD_CLAIM_VALUE" "ISS_CLAIM" "ISS_CLAIM_VALUE" "GEOWEB_USERNAME_CLAIM" "GEOWEB_REQUIRE_READ_PERMISSION" "GEOWEB_REQUIRE_WRITE_PERMISSION" "ALLOW_ANONYMOUS_ACCESS" "BACKEND_HOST" "NGINX_PORT_HTTP" "NGINX_PORT_HTTPS" "ENV_VAR_STRICT_MODE" }}
      {{- if index $nginx $name }}
        - name: {{ $name }}
          value: {{ include "geoweb-warnings-backend.envValue" (index $nginx $name) }}
      {{- end }}
      {{- end }}
      {{- range $name := list "NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE" "TRUST_FORWARDED_HEADERS" }}
      {{- if hasKey $nginx $name }}
        - name: {{ $name }}
          value: {{ include "geoweb-warnings-backend.envValue" (index $nginx $name) }}
      {{- end }}
      {{- end }}
        volumeMounts:
        - name: nginx-run
          mountPath: "/run"
      {{- if and .Values.warnings.useCustomConfigurationFiles }}
        - mountPath: "/nginx.conf"
          subPath: "nginx.conf"
          name: {{ .Values.warnings.name }}-volume
      {{- end }}
      {{- if eq $dbMode "sidecar" }}
      - name: {{ .Values.warnings.db.name }}
        image: {{ .Values.warnings.db.sidecar.image }}
        ports:
          - containerPort: {{ .Values.warnings.db.sidecar.port }}
        env:
          - name: POSTGRES_DB
            value: {{ .Values.warnings.db.databaseName }}
          - name: POSTGRES_USER
            value: {{ .Values.warnings.db.username }}
          - name: POSTGRES_PASSWORD
            value: {{ .Values.warnings.db.sidecar.password }}
      {{- end }}
      volumes:
      - name: nginx-run
        emptyDir: {}
    {{- if .Values.warnings.useCustomConfigurationFiles }}
      - name: {{ .Values.warnings.name }}-volume
      {{- if eq .Values.warnings.customConfigurationLocation "s3"}}
        emptyDir: {}
      {{- else if eq .Values.warnings.customConfigurationLocation "local"}}
        persistentVolumeClaim:
          claimName: {{ .Values.warnings.name }}-claim
      {{- end }}
    {{- end }}
    {{- if $usesExternalSecretProvider }}
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: {{ .Values.warnings.db.external.secretProvider.className | quote }}
    {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - {{ .Values.warnings.name }}
              topologyKey: {{ .Values.warnings.podAntiAffinity.topologyKey | quote }}
