{{- $dbMode := default "sidecar" .Values.warnings.db.mode }}
{{- if not (has $dbMode (list "sidecar" "external" "zalando")) }}
{{- fail "warnings.db.mode must be one of: sidecar, external, zalando" }}
{{- end }}
{{- if or (hasKey .Values.warnings "db_secret") (hasKey .Values.warnings "db_secretName") (hasKey .Values.warnings "db_secretType") (hasKey .Values.warnings "db_secretPath") (hasKey .Values.warnings "db_secretKey") }}
{{- fail "warnings.db_secret* values were removed in chart 2.0.0. Use warnings.db.external.* instead." }}
{{- end }}
{{- if or (hasKey .Values "secretProvider") (hasKey .Values "secretProviderParameters") (hasKey .Values.warnings "iamRoleARN") (hasKey .Values.warnings "spcName") }}
{{- fail "Legacy secret provider values were removed in chart 2.0.0. Use warnings.db.external.secretProvider.* instead." }}
{{- end }}
{{- if or (hasKey .Values.warnings.db "enableDefaultDb") (hasKey .Values.warnings.db "useZalandoOperatorDb") (hasKey .Values.warnings.db "image") (hasKey .Values.warnings.db "port") (hasKey .Values.warnings.db "POSTGRES_DB") (hasKey .Values.warnings.db "POSTGRES_USER") (hasKey .Values.warnings.db "POSTGRES_PASSWORD") (hasKey .Values.warnings.db "POSTGRES_VERSION") (hasKey .Values.warnings.db "numberOfInstances") (hasKey .Values.warnings.db "instanceSize") (hasKey .Values.warnings.db "zalandoTeamId") (hasKey .Values.warnings.db "enableLogicalBackup") (hasKey .Values.warnings.db "cleanInstall") (hasKey .Values.warnings.db "backupTimestamp") (hasKey .Values.warnings.db "backupBucket") }}
{{- fail "Legacy warnings.db values were removed in chart 2.0.0. Set warnings.db.mode and migrate database settings using the README migration map." }}
{{- end }}
{{- $clone := .Values.warnings.db.zalando.clone }}
{{- if and (eq $dbMode "zalando") $clone.enabled (not $clone.backupBucket) }}
{{- fail "warnings.db.zalando.clone.backupBucket is required when cloning is enabled" }}
{{- end }}
{{- if and (eq $dbMode "zalando") $clone.enabled (not $clone.timestamp) }}
{{- fail "warnings.db.zalando.clone.timestamp is required when cloning is enabled" }}
{{- end }}
{{- if eq $dbMode "zalando" }}
apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: {{ .Values.warnings.db.name }}
spec:
  teamId: {{ .Values.warnings.db.zalando.teamId }}
  volume:
    size: {{ .Values.warnings.db.zalando.volumeSize }}
  numberOfInstances: {{ .Values.warnings.db.zalando.instances }}
  users:
    {{ .Values.warnings.db.username }}:
    - superuser
    - createdb
  databases:
    {{ .Values.warnings.db.databaseName }}: {{ .Values.warnings.db.username }}
  postgresql:
    version: {{ .Values.warnings.db.zalando.postgresVersion | quote }}
  enableLogicalBackup: {{ .Values.warnings.db.zalando.enableLogicalBackup }}
  {{- if $clone.enabled }}
  clone:
    cluster: {{ .Values.warnings.db.name | quote }}
    timestamp: {{ $clone.timestamp | quote }}
    s3_wal_path: {{ $clone.backupBucket | quote }}
  {{- end }}
{{- end }}
