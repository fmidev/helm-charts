# auth-backend v1.0.3 cannot bind privileged port 80 during Kind install tests.
# Port 8081 is used by the messageconverter sidecar in this chart.
taf:
  nginx:
    NGINX_PORT_HTTP: 8082
    startupProbe:
      httpGet:
        path: /health_check?startup=true
        port: 8082
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12
    livenessProbe:
      httpGet:
        path: /health_check
        port: 8082
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    readinessProbe:
      httpGet:
        path: /health_check?readiness=true
        port: 8082
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 1
